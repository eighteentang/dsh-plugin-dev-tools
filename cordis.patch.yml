# 开发工具箱 组合包补丁
#
# 为什么单独一个包：它含"读 DOM 做定位"这类只有开发者需要的能力，
# 不该出现在用户拿到的成品里。产品只装 dsh-plugin-qq-bridge-v4。
#
# 行 id 与产品区分开（dev-tools），避免与 QQ 插件互相覆盖配置。
- insert:
    - id: dev-tools
      name: dsh-plugin-dev-tools
      # ⚠ 这里**曾经**有三个配置字段 `enabled` / `trigger` / `ruleScope`，2026-10-12 全删。
      #   它们不是"暂时没用"，而是**永远不起作用** —— 留着等于给用户一个假旋钮：
      #     · enabled   —— 真开关在设置页（状态存浏览器 localStorage），这个字段只打过一句日志
      #     · trigger   —— 宿主半从不读它；设置页里那两个选项（hover / click）根本没实现
      #     · ruleScope —— 除校验与存值外，全库没有第二处引用
      #   判据：**界面上承诺了但不生效的配置，比没有这个配置更糟** —— 用户会以为自己调过了。
      #   所以现在不声明任何配置项（`experienceFile` 仍可用，只是不给默认值）。
      config: {}
